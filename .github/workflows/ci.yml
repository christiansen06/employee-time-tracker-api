name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build & tests
        working-directory: employee-time-tracker
        run: ./mvnw -B verify

      - name: Docker build (smoke)
        working-directory: employee-time-tracker
        run: docker build -t employee-time-tracker:ci .
