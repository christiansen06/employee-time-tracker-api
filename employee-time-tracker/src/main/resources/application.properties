spring.application.name=employee-time-tracker

# PERFILES
# Sin SPRING_PROFILES_ACTIVE se asume prod (configuracion segura por defecto).
# Para desarrollo local: SPRING_PROFILES_ACTIVE=dev
spring.profiles.default=prod

# DATABASE
# Los valores sensibles se leen SIEMPRE de variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_time_tracker?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / HIBERNATE
# El esquema lo administra Flyway; Hibernate solo valida que coincida.
spring.jpa.hibernate.ddl-auto=validate

# FLYWAY (migraciones de esquema)
# {vendor} resuelve a mysql / postgresql segun el driver activo.
# baseline-on-migrate permite adoptar bases existentes (creadas con ddl-auto=update)
# sin recrearlas: se marcan como version 1 y solo se aplican V2 en adelante.
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.baseline-on-migrate=true

# JWT
# IMPORTANTE: en produccion definir JWT_SECRET (>= 32 chars) como variable de entorno.
# La clave de abajo es solo para desarrollo local y NO debe usarse en produccion.
jwt.secret=${JWT_SECRET:devLocalSecretKeyChangeMeAtLeast32CharsLong}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# ADMIN INICIAL (seed)
# Se crea automaticamente al arrancar si no existe ningun ADMIN.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin1234}

# SERVER
# Render (y otros hosts) inyectan el puerto via la variable PORT.
server.port=${PORT:8080}

# ACTUATOR (observabilidad)
# Solo health e info por HTTP; metrics y el resto quedan internos.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
